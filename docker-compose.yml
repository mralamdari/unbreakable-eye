services:
  fastapi:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src/web/static:/app/src/web/static:ro
    depends_on:
      - fastapi
    restart: unless-stopped