services:

  postgres:
    image: pgvector/pgvector:pg16          # official image with pgvector pre-installed
    container_name: unbreakable_eye_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-unbreakable_eye}
      POSTGRES_USER:     ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # required — no default, must be in .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"       # bind to localhost only — never expose to 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-unbreakable_eye}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  fastapi:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: unbreakable_eye_api
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres    # override: Docker always uses postgres service
    depends_on:
      postgres:
        condition: service_healthy   # wait for DB to be ready before starting app
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  nginx:
    image: nginx:alpine
    container_name: unbreakable_eye_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/web/static:/app/src/web/static:ro
    depends_on:
      - fastapi

volumes:
  postgres_data:    # named volume — survives container restarts and rebuilds
