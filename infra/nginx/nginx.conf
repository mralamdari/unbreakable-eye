server {
    listen 80;

    # Serve static files directly — zero FastAPI CPU cost
    location /static/ {
        alias /app/src/web/static/;
        expires 1d;
    }

    # Proxy API and stream to FastAPI
    location / {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Required for MJPEG streaming — disable buffering
        proxy_buffering off;
        proxy_cache off;

        # MJPEG streams are long-lived — prevent nginx from cutting them off
        proxy_read_timeout 86400s;   # 24 hours
        proxy_send_timeout 86400s;

        # Do not let nginx rewrite chunked encoding for streaming endpoints
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
}