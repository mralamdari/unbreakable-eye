[tool.poetry]
name = "unbreakable-eye"
version = "0.1.0"
description = "Production-Grade Edge AI Inference Microservice for Real-Time Computer Vision"
authors = ["Esmaeil F. Alamdari <mralamdari2000@gmail.com>"]
readme = "README.md"
repository = "https://github.com/mralamdari/unbreakable-eye"
license = "MIT"

# --- THIS WAS MISSING. IT TELLS POETRY WHERE YOUR CODE IS ---
packages = [
    { include = "src" }
]
# ------------------------------------------------------------

[tool.poetry.dependencies]
python = "^3.10"

# --- CORE ---
huggingface-hub = "^0.20.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
loguru = "^0.7.2"

# --- VISION & AI ---
opencv-python-headless = "^4.9.0"
supervision = "^0.27.0"
onnx = "^1.20.0"
onnxslim = "^0.1.82"
requests = "^2.32.5"
ultralytics = "^8.1.0"       # Needed for YOLOv8
onnxruntime = "^1.15.0"      # Needed for YOLOX/RT-DETR (CPU version), was incorrectly ^1.82.0
# onnxruntime-gpu = "^1.17.0" # Use THIS instead of onnxruntime if you have NVIDIA GPU

# --- OPENVINO (Optional) ---
openvino = "2023.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.2.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- MYPY CONFIGURATION ---
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
exclude = ["venv", ".venv", "__pycache__"]
no_implicit_optional = true
explicit_package_bases = true
no_site_packages = true

# --- MYPY OVERRIDES: third-party libs with no stubs ---
[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "supervision.*",
    "loguru.*",
    "onnxruntime.*",
    "ultralytics.*",
    "openvino.*",
    "fastapi.*",
    "uvicorn.*",
    "huggingface_hub.*",
    "passlib.*",
    "itsdangerous.*",
    "jinja2.*",
]
ignore_missing_imports = true

# --- MYPY OVERRIDES: numpy shape inference is imprecise ---
[[tool.mypy.overrides]]
module = [
    "src.core.database",
    "src.engine.pipeline",
    "src.vision.detectors.yolox",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-v"

[tool.ruff]
exclude = ["tests/integration/", "venv/", ".venv/", ".mypy_cache/"]
line-length = 100
