<!DOCTYPE html>
<html>
<head>
    <title>Stream Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .video-card { background: #2c2c2c; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); width: 48%; }
        iframe { width: 100%; height: 300px; border: 1px solid #444; }
        h2 { margin: 5px 0; font-size: 16px; }
    </style>
</head>
<body>
    <h1 style="text-shadow: 0 0 10px #000;">Multi-Stream Dashboard</h1>
    <p>Watching 3 streams simultaneously from different URLs.</p>
    
    <div class="container">
        <!-- Video 1 -->
        <div class="video-card">
            <h2>Stream 1 (Big Buck Bunny)</h2>
            <iframe src="http://localhost:8000/video_feed/1"></iframe>
        </div>

        <!-- Video 2 -->
        <div class="video-card">
            <h2>Stream 2 (Big Ben)</h2>
            <iframe src="http://localhost:8000/video_feed/2"></iframe>
        </div>

        <!-- Video 3 -->
        <div class="video-card">
            <h2>Stream 3 (HLS Example)</h2>
            <iframe src="http://localhost:8000/video_feed/3"></iframe>
        </div>
    </div>
</body>
</html>
